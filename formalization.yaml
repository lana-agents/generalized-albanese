# formalization.yaml (v0.4): repo-root metadata for this formalization,
# following https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

project:
  name: "generalized-albanese"
  description: >-
    Planned Lean 4 / Mathlib formalization of generalized Albanese varieties for complements Y = Z ∖ D of
    normal-crossings divisors D in smooth projective varieties Z: the semi-abelian extension
    0 → T_Y → Alb(Y) → Alb(Z) → 0, the identification of the character group of T_Y with the boundary
    divisors algebraically equivalent to zero, the universal property and base-change/functoriality, and the
    comparison with the maximal torsion-free abelian quotient of the geometric étale fundamental group
    (Topics in Absolute Anabelian Geometry I, Appendix, Proposition A.8).
    Currently formalised: the punctured-curve case at the level of points, characters and
    fundamental groups (boundary torus with character group Div⁰_D, abelianisation of punctured
    surface groups, finite-coefficient étale sequence under an explicit cuspidal-presentation
    interface, generalized Jacobian on points under an explicit divisor-theory interface).
    See Blueprint.md for the scope decision.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Morphismes universels et variété d'Albanese"
    authors: ["Jean-Pierre Serre"]
    type: "article"
    note: "Background reference (README, Established sources); the Albanese variety itself is not formalised."
  - title: "Fondements de la Géométrie Algébrique (FGA)"
    authors: ["Alexander Grothendieck"]
    type: "book"
    note: "Background reference (README, Established sources); not used directly."
  - title: "Néron Models"
    authors: ["Siegfried Bosch", "Werner Lütkebohmert", "Michel Raynaud"]
    type: "book"
    note: "Background reference (README, Established sources); not used directly."
  - title: "Albanese and Picard 1-motives"
    authors: ["Luca Barbieri-Viale", "Vasudevan Srinivas"]
    type: "article"
    note: "Background reference (README, Established sources); not used directly."
  - title: "On the Albanese map for smooth quasi-projective varieties"
    authors: ["Michael Spiess", "Tamás Szamuely"]
    type: "article"
    note: "Background reference (README, Established sources); not used directly."

related_formalizations:
  - id: "https://github.com/lana-agents/iut"
    relationship: "other"
    note: "Intended as an input to the anabelian machinery of iut; not used by it."

classification:
  arxiv: ["math.AG"]
  msc2020: ["14K30", "14L10", "14F35"]

status:
  scope: "partial: punctured-curve case (characters, surface-group abelianisation, generalized Jacobian on points) relative to explicit interfaces"
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "GeneralizedAlbanese.charDualEquiv"
    - "GeneralizedAlbanese.finrank_boundaryChar"
    - "GeneralizedAlbanese.ker_boundaryTorusProj"
    - "GeneralizedAlbanese.SurfaceGroup.characterQuotientEquiv"
    - "GeneralizedAlbanese.SurfaceGroup.integralCharacterQuotientEquiv"
    - "GeneralizedAlbanese.SurfaceGroup.isMulTorsionFree_abelianization"
    - "GeneralizedAlbanese.SurfaceGroup.range_cuspMap"
    - "GeneralizedAlbanese.CuspidalPresentation.residue_eq_zero_iff"
    - "GeneralizedAlbanese.CuspidalPresentation.completion"
    - "GeneralizedAlbanese.BoundaryEvaluation.genJacToJac_eq_zero_iff"
    - "GeneralizedAlbanese.BoundaryEvaluation.torusToGenJac_injective"
    - "GeneralizedAlbanese.CurveDivisorData.jacEquivPic"

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        orchestra for running the agents, taxis for project management, and Claude (Claude Code) as the
        coding agent; Lean/Lake builds with `lake build --wfail`.
      prompting_notes: >-
        Human input consisted of high-level task descriptions and scope decisions.
  notes: >-
    Agents were run with orchestra; project management (issues, status) was done in taxis;
    Claude was the coding agent.

fidelity:
  divergences: >-
    Only the punctured-curve case is treated, and not as algebraic groups: the generalized Jacobian
    appears through its k-points relative to an explicit divisor-theory interface
    (CurveDivisorData, BoundaryEvaluation), and the étale fundamental group through an explicit
    interface (CuspidalPresentation) standing for the comparison with the profinite surface group.
    The universal property of the Albanese, the higher-dimensional normal-crossings case and Tate
    twists are not formalised (Blueprint.md).

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
    Interfaces are structure fields and hypotheses documented in the module docstrings and in
    Blueprint.md.

acknowledgements: "Built on Mathlib (Apache-2.0)."
