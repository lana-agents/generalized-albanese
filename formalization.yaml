version: "v0.4"

project:
  name: "generalized-albanese"
  description: >-
    Planned Lean 4 / Mathlib formalization of generalized Albanese varieties for complements Y = Z ∖ D of
    normal-crossings divisors D in smooth projective varieties Z: the semi-abelian extension
    0 → T_Y → Alb(Y) → Alb(Z) → 0, the identification of the character group of T_Y with the boundary
    divisors algebraically equivalent to zero, the universal property and base-change/functoriality, and the
    comparison with the maximal torsion-free abelian quotient of the geometric étale fundamental group
    (Topics in Absolute Anabelian Geometry I, Appendix, Proposition A.8).
    The repository is currently an empty scaffold: no definitions or theorems yet.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Morphismes universels et variété d'Albanese"
    authors: ["Jean-Pierre Serre"]
    type: "article"
    note: "Planned reference (README, Established sources); nothing is formalised yet."
  - title: "Fondements de la Géométrie Algébrique (FGA)"
    authors: ["Alexander Grothendieck"]
    type: "book"
    note: "Planned reference (README, Established sources); nothing is formalised yet."
  - title: "Néron Models"
    authors: ["Siegfried Bosch", "Werner Lütkebohmert", "Michel Raynaud"]
    type: "book"
    note: "Planned reference (README, Established sources); nothing is formalised yet."
  - title: "Albanese and Picard 1-motives"
    authors: ["Luca Barbieri-Viale", "Vasudevan Srinivas"]
    type: "article"
    note: "Planned reference (README, Established sources); nothing is formalised yet."
  - title: "On the Albanese map for smooth quasi-projective varieties"
    authors: ["Michael Spiess", "Tamás Szamuely"]
    type: "article"
    note: "Planned reference (README, Established sources); nothing is formalised yet."

related_formalizations:
