name = "generalized-albanese"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GeneralizedAlbanese"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

[[require]]
name = "elliptic_curves"
git = "https://github.com/lana-agents/elliptic-curves"
rev = "8e2b20806fbe97d6fede33dc4eda1e7f350fb138"

[[lean_lib]]
name = "GeneralizedAlbanese"
